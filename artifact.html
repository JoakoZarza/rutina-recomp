<title>Rutina Recomp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#090b08">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<style>
  /* Entrada para el artifact: el visor ya rellena :root con el área segura superior. */
  body { padding-top: 0; }
</style>
<script type="module" src="js/main.js"></script>

<header class="top">
  <div class="wrap">
    <div class="brand">Rutina <b>Recomp</b></div>
    <nav class="nav" aria-label="Secciones">
      <button id="nav-train" data-act="view" data-v="train" aria-current="page">Entrenar</button>
      <button id="nav-prog" data-act="view" data-v="prog">Progreso</button>
      <button id="nav-lib" data-act="view" data-v="lib">Ejercicios</button>
    </nav>
  </div>
  <div class="wrap clock" id="clock">
    <span class="mono" id="clockT">0:00:00</span>
    <div class="bar" id="clockBar"><i></i></div>
    <small>de 1:30 h</small>
  </div>
</header>

<main class="wrap" id="main"></main>

<dialog class="info" id="info" aria-labelledby="infoTitle">
  <div class="info-body" id="infoBody"></div>
</dialog>

<div class="dock" aria-live="polite">
  <div class="dock-in" id="dockIn">
    <button class="idle" id="tIdle" data-act="rest" data-s="90" aria-label="Iniciar descanso de 90 segundos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg><span class="mono">90 s</span>
    </button>
    <div class="run" id="tRun" hidden>
      <svg class="ring" viewBox="0 0 56 56" aria-hidden="true"><circle class="bgc" cx="28" cy="28" r="24"/><circle class="fgc" id="tRing" cx="28" cy="28" r="24"/></svg>
      <div class="tm"><div class="tt" id="tTime">1:30</div><div class="tl" id="tLabel">Descanso</div></div>
      <div class="tbtns">
        <button id="tMinus" data-act="tadd" data-s="-15" aria-label="Restar 15 segundos">−15</button>
        <button id="tPlus" data-act="tadd" data-s="15" aria-label="Sumar 15 segundos">+15</button>
        <button id="tSkip" class="skip" data-act="tskip">Listo</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
